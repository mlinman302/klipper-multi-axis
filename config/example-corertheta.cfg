# This file is an example config file for core r-theta printers. One
# may copy and edit this file to configure a new core r-theta printer.
#
# The machine is a polar printer - a rotating bed plus a radial arm -
# whose arm carriage also carries a tool that rotates about the Y axis
# (the B axis of docs/Multi_Axis.md).  Four motors:
#
#   [stepper_c]     the rotating bed
#   [stepper_r]     first gantry motor
#   [stepper_tilt]  second gantry motor
#   [stepper_z]     leadscrew raising the gantry
#
# The two gantry motors are coupled through a differential: driving them
# in the same direction rotates B, driving them in opposition moves the
# arm along R.  R is the radius of the toolhead in the XY plane from the
# centre of the bed - the coordinate the arm rail actually travels in.
#
# As on a polar printer the g-code words stay cartesian: an X/Y position
# is resolved into a bed angle and an arm radius, so R is a machine
# coordinate rather than a g-code axis.  The HOME_R macro at the bottom
# of this file homes the R rail.
#
# CORE R-THETA KINEMATICS ARE A WORK IN PROGRESS.  As with polar
# kinematics, moves around the 0, 0 position are known to not work
# properly.

# See docs/Config_Reference.md for a description of parameters.

# The rotating bed.  Its angle is derived from the commanded X/Y
# position and is not itself a g-code axis, so it has no endstop.
[stepper_c]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
gear_ratio: 80:16

# First gantry motor.  Carries the endstop and the travel limits of the
# R axis, in mm of arm radius from the centre of the bed.  A negative
# position_min is the far side of the bed, reached by turning the bed
# rather than by driving the arm through the middle; position_endstop
# may not be negative.
[stepper_r]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 200
position_min: 0
position_max: 200
homing_speed: 50

# Second gantry motor.  Carries the endstop and the travel limits of the
# B axis, in degrees.  Its rotation_distance is in gantry travel, as for
# stepper_r, since a gantry motor position mixes B with the arm radius.
[stepper_tilt]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2
position_endstop: -45
position_min: -45
position_max: 100
homing_speed: 30

# Z homes on the probe carried by the tilting head, so the head has to
# face the bed with the probe before G28 Z - see the HOME_Z macro.
# Probing runs with RTCP off, so position_min bounds how far the carriage
# may descend on a probing move, in the ordinary way.
[stepper_z]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -8
position_max: 200

######################################################################
# Tilting head, probing and mesh bed levelling
######################################################################

# Rotational tool centre point compensation.
#
#   RTCP on   g-code commands the nozzle tip: a B move swings the tip
#             about the pivot, so the arm and Z move to cancel the swing
#             and hold the tip where it was asked to be.  This is the
#             printing mode.
#   RTCP off  g-code commands the carriage: a B move just turns the head.
#             This is the homing, probing and bed mesh mode.
#
# Two conventions fix the geometry, and neither is configurable:
#
#   * At B=0 the nozzle points straight down, exactly as on an ordinary
#     printer.  True in both modes.
#   * A positive B tilts the nozzle outboard - the tip swings away from
#     the centre of the bed.  If this machine turned the other way the
#     fix would be invert_b_direction in [printer] below, not here.
#
# The two offsets describe where the nozzle tip sits relative to the B
# pivot at B=0, each positive in the direction the tool actually is.
# This is a polar machine, so "horizontal" means along the arm.
[rtcp]
# How far the nozzle tip is below the B pivot
tool_vertical_offset: 69.1717
# How far it is inboard of the pivot, ie towards the centre of the bed
tool_horizontal_offset: 0
enable: True

# The probe is bolted to the tilting head, a fixed angle around the B
# pivot from the nozzle, and is used in exactly one orientation: the B
# angle at which its pin hangs vertically.  All four of its offsets are
# measured, in that orientation, with RTCP off - none of them is derived
# from the [rtcp] geometry.
[bltouch]
control_pin: PB6
sensor_pin: ^PB5
probe_with_touch_mode: True
# The B angle at which the pin is vertical.  The nozzle is vertical at
# B=0, so this is also the angular distance from the nozzle to the probe.
b_offset: 45
# Where the probe sits relative to the carriage at that angle.  On this
# machine the pin hangs straight below the B pivot, which is straight
# above the carriage, so both are zero.  x_offset is along the arm
# (positive outboard) and y_offset across it.
x_offset: 0
y_offset: 0
# How far the trigger point is below the nozzle - the usual Klipper
# meaning, calibrated the usual way with PROBE_CALIBRATE.
z_offset: -0.1

# Read a commanded B as a lean toward the *bed's* +X direction rather
# than as a machine tilt, and give the machine the projection of that
# lean onto the plane the head can actually tilt in:
#
#   b_machine = B * cos(bed angle),   bed angle = atan2(Y, X)
#
# So at a bed angle of 0 the commanded B reaches the machine untouched;
# directly across the bed it arrives inverted; and square to those it
# collapses to zero, because there the lean being asked for is
# perpendicular to the plane the head tilts in.  Holding B10 through a
# full turn of the bed sweeps the machine's B over 10 -> 0 -> -10 -> 0
# -> 10.
#
# The scaling applies at *every* angle - the ratio at a given X/Y is the
# same at B5 as at B50, with no threshold anywhere.  That means an
# orientation angle (the probe angle, the -90 park) would be scaled too,
# so homing, probing and RTCP_PROBE_ORIENT run with the projection off,
# exactly as they already run with RTCP off.  The macros below do that;
# klippy refuses the operation if they do not.
#
[b_projection]
# The machine-level switch for the whole feature.  True reads B in
# the bed frame as above; False makes B a plain machine tilt - the
# head leans along the arm by exactly the angle commanded, at every
# bed position - which is what this machine did before the section
# existed.  The macros below turn the projection off for homing and
# probing and then RESTORE it, so this setting is what they come
# back to: set it False and the projection stays off everywhere,
# without editing a single macro.
enable: True
#max_b_velocity: 60

# Turning the head to and from the probing orientation, and applying the
# probe's x/y offsets along and across the arm rather than along the bed
# x/y (which turn with the bed).  The offsets themselves live in
# [bltouch] above; RTCP_PROBE_INFO prints the lot.
[rtcp_probe]
# The arm must be able to put the probe over the whole bed; checked at
# startup against the probe's x_offset.
bed_radius: 50
# Carriage height the head is raised to before B turns, so the probe does
# not sweep through the bed.
orient_lift_z: 40

# Gravity-referenced measurement of B, from a BMI160 IMU bolted to the
# rotating part of the head.  An accelerometer at rest reads the gravity
# vector, and a gravity vector in the head's frame is the head's tilt -
# absolutely, whatever the axis has done since it was last homed.  That
# makes it an independent check on the StallGuard B home, which can
# silently do nothing (see the G4 P2000 in HOME_B below).
#
# The BMI160 carries a gyroscope alongside the accelerometer, in one
# package on one FIFO, and that is what turns "the head was probably
# still" into "the head was measurably still": max_rotation_rate below
# rejects a measurement taken while the head was turning.  The same
# gyroscope is what will make the rotation sense and the drive ratio
# measurable rather than declared - see docs/BMI160_IMU.md.
#
# The BMI160 is wired to I2C1 of the Raspberry Pi Zero W that runs
# klippy (GPIO2 = SDA, header pin 3; GPIO3 = SCL, header pin 5).  The
# Pi reads it through the Linux-process host MCU, klipper_mcu, which
# gets an [mcu rpi] section and must be built from this tree - this
# branch's config_bmi160 takes an argument older builds do not know.
# See docs/BMI160_IMU.md, "Bringing it up".
#
# The Pi's I2C bus speed is set by the kernel, not by i2c_speed, and
# defaults to 100 kHz.  Set dtparam=i2c_arm_baudrate=400000 in
# /boot/firmware/config.txt.  Even then the bus cannot carry the
# driver's default 1600 Hz with comfort, so this machine runs rate: 400,
# which costs a half-second window average nothing.  If the bus falls
# behind anyway, B_MEASURE refuses with "possible fifo overflows" rather
# than returning a mistimed angle.
#
# The two vectors declare which way is B=0.  Both name the sensor axis
# that points straight *up* at the angle in question - an accelerometer
# at rest reads the specific force, not gravity - so find them by
# parking the head and running BMI160_QUERY: the axis reading about
# +9800 mm/s^2 is the one to name (negate it if it reads -9800).  The
# third axis is the B rotation axis and is worked out from these.  These
# are properties of how *this* chip is mounted: if the sensor is
# replaced or remounted, derive them again rather than carrying the old
# values across.
#
# Run BMI160_CALIBRATE with the head parked at B=0 before trusting the
# numbers.  GYRO=1 alone needs no pose and zeroes the gyroscope; adding
# X/Y/Z (whichever axis reads +1 g at B=0 set to 1, the others 0)
# calibrates the accelerometer's offset to 3.9 mg, which is most of what
# stood between B_MEASURE and a calibrated angle.  Both are volatile, so
# repeat after a power cycle.
#[mcu rpi]
#serial: /tmp/klipper_host_mcu
#
#[bmi160]
#i2c_mcu: rpi
#i2c_bus: i2c.1
# 105 (0x69) with SA0 high is the default; 104 (0x68) with SA0 grounded.
# Check with i2cdetect -y 1 - breakout boards differ.
#i2c_address: 105
#rate: 400
# +/-2 g resolves 0.061 mg per count, which is worth about 0.0035 deg of
# tilt.  Raise to 16 if the same chip is also used for tap detection.
#accel_range: 2
#
#[accel_b_homing]
#zero_vector: +z
#positive_vector: +x
# A USB link delivers its last batch of samples after the moves have
# finished, so a trailing dwell keeps the averaging window covered.  0.3
# is the default and is plenty for USB; raise it if B_MEASURE reports
# fewer samples than expected.
#batch_margin: 0.3
# The gyroscope gate.  Park the head, run B_MEASURE, and read the
# reported rotation rate - that is this machine's noise floor, and the
# gate belongs just above it.  1.0 is a provisional default.
#max_rotation_rate: 1.0
# The accelerometer and the gyroscope are fused through a complementary
# filter crossing over at fusion_tau: above it the accelerometer wins
# and the angle is absolute, below it the gyroscope wins and the angle
# tracks the head through the ringing after a move.  B_MEASURE prints
# the fused and accelerometer-only angles side by side, which is how to
# tune this: they agree on a parked head, and the settle_time at which
# they start to disagree is the one that was actually needed.
#fusion_tau: 0.2

# A round bed of 50mm radius.  The mesh turns with the bed and the bed
# axis does not home, so a saved profile means nothing after a restart:
# calibrate before every print and do not use BED_MESH_PROFILE.
#
# Probing runs with RTCP off, so horizontal_move_z is a *carriage*
# height and the probe reaches only z_offset below it - an ordinary value
# works.  The mesh z values are the reported toolhead z at each trigger;
# no RTCP arithmetic is involved.
[bed_mesh]
speed: 60
horizontal_move_z: 5
mesh_radius: 50
mesh_origin: 0, 0
round_probe_count: 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0


[extruder]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 33.500
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PB4
sensor_type: ATC Semitec 104GT-2
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 250

[heater_bed]
heater_pin: PH5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK6
control: watermark
min_temp: 0
max_temp: 130

[fan]
pin: PH6

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corertheta
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30
max_angular_velocity: 5
# B is driven by the two gantry motors together, so it is declared here
# and has no [stepper_b] section of its own.
additional_axes: b
#b_coupling_ratio: 1.0
#invert_b_direction: False


######################################################################
# Homing macros
######################################################################

# Homing the R rail is a straight radial sweep at a bed angle of zero,
# which is where R and the cartesian X coincide - so the kinematics runs
# it through the X axis slot and G28 X is the R home.  The sweep always
# starts from a radius of zero: crossing the centre would be a half turn
# of the bed commanded in the instant the sign of the radius flips, which
# overruns the step compressor on the [stepper_c] queue.
#
# The sweep resolves the bed angle along with the radius, so it reports
# both x and y as homed - printer.toolhead.homed_axes gains "xy".
[gcode_macro HOME_R]
description: Home the R rail (the arm radius from the centre of the bed)
gcode:
    # Homing runs in the machine frame, so both transforms are off for
    # it and G28 refuses to run with either on.  This is not just
    # bookkeeping: with RTCP on, what G28 homes to is read back as a
    # tool tip position, so at any B but zero the arm ends up homed to
    # the wrong radius.  Neither toggle moves the machine.
    SET_RTCP ENABLE=0
    SET_B_PROJECTION ENABLE=0
    # A sensorless (StallGuard) endstop keeps its stall flag set for a
    # moment after any move, so a homing move issued right after another
    # one triggers instantly and the axis never moves - without raising
    # an error.  The dwell lets the flag clear.  Harmless on a machine
    # with a physical endstop.
    G4 P2000
    G28 X

# The B (tool rotation) axis is driven by the same two gantry motors, so
# it is homed on its own and with the same dwell in front of it.
#
# This is the case that bites.  With RTCP on, sweeping B looking for the
# endstop is also an X and Z move of up to the whole tool offset, before
# either axis is homed.  With the bed-frame projection on, the endstop
# sweep and the -90 park are scaled by whatever bed angle is under the
# arm - by nearly zero if it sits square to the tilt plane, so the sweep
# never reaches the endstop at all.
[gcode_macro HOME_B]
description: Home the B axis (tool rotation about Y)
gcode:
    SET_RTCP ENABLE=0
    SET_B_PROJECTION ENABLE=0
    G4 P2000
    G28 B

# Z homes on the probe, so the head has to be turned to face the bed with
# it first and then moved so the probe is actually over the bed - after
# HOME_R the arm is parked at its outermost radius, well off it.  The
# homed Z follows from the BLTouch's z_offset alone.
#
# Both transforms must be off.  Probing is refused with RTCP on, and with
# it on a B move is an X/Z move, which cannot run before those axes are
# homed.  RTCP_PROBE_ORIENT turns to a *machine* angle, which the
# bed-frame projection would scale.  Since Z is not homed yet the head
# must already clear the bed when this runs.
#
# Probe off centre.  With RTCP off the arm radius is the bed radius being
# probed, and a polar machine handles radius zero badly.
[gcode_macro HOME_Z]
description: Home the Z axis (gantry height)
gcode:
    G4 P2000
    SET_RTCP ENABLE=0
    SET_B_PROJECTION ENABLE=0
    RTCP_PROBE_ORIENT MODE=PROBE
    RTCP_PROBE_MOVE X=25 Y=0 F=50
    G28 Z

# Whole machine, in the order the coupled drive needs: R first, so the
# arm is at a known radius, then B, then Z.  Each step puts the machine
# into the machine frame for itself, so this works whatever state it was
# left in; the last lines put it back into the printing frame.  Both
# toggles happen with the nozzle vertical, where the two frames coincide
# and neither conversion turns the head.
[gcode_macro HOME_ALL]
description: Home R, B and Z
gcode:
    HOME_R
    HOME_B
    HOME_Z
    RTCP_PROBE_ORIENT MODE=TOOL
    SET_B_PROJECTION RESTORE=1
    SET_RTCP ENABLE=1


######################################################################
# Mesh bed levelling macros
######################################################################

# BED_MESH_CALIBRATE has to run in the machine frame with the probe
# facing the bed, and printing has to resume in the print frame with the
# nozzle facing it, so wrap the built-in command.  {rawparams} passes
# PROFILE=, METHOD=, MESH_RADIUS= and the rest straight through.
[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_BASE
gcode:
    SET_RTCP ENABLE=0
    SET_B_PROJECTION ENABLE=0
    RTCP_PROBE_ORIENT MODE=PROBE
    BED_MESH_CALIBRATE_BASE {rawparams}
    RTCP_PROBE_ORIENT MODE=TOOL
    SET_B_PROJECTION RESTORE=1
    SET_RTCP ENABLE=1

# The bed axis does not home, so the mesh - which turns with the bed -
# has to be measured afresh for every print.  Call this from the slicer's
# start g-code instead of loading a saved profile.
[gcode_macro START_PRINT]
description: Home, mesh the bed and leave the nozzle facing it
gcode:
    HOME_ALL
    BED_MESH_CLEAR
    BED_MESH_CALIBRATE
