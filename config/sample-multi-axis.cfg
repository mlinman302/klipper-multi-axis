# Example configuration fragment for a machine with additional
# rotational axes (A/B/C).
#
# A rotates about X, B rotates about Y, C rotates about Z.  All
# positions are in degrees.
#
# See docs/Multi_Axis.md for the design and current limitations.
#
# This file is a fragment - include it from your printer.cfg with
# [include sample-multi-axis.cfg] and add the "additional_axes" option
# to your own [printer] section.

# ---------------------------------------------------------------------
# Declare the extra axes.  Add this option to your [printer] section.
# The letters may be given in any order, separated by commas, spaces or
# nothing at all ("abc", "a b c" and "a,b,c" are equivalent).
#
# Each declared letter must be driven either by a [stepper_<letter>]
# section as shown below (one motor per axis), or - when several motors
# together move the axis, as on a core r-theta stage - by a carriage on
# that axis in [generic_cartesian].  See
# test/klippy/multi_axis_rtheta.cfg for the coupled form.
# ---------------------------------------------------------------------
#[printer]
#additional_axes: a, c

# ---------------------------------------------------------------------
# A axis (rotation about X) - a homeable trunnion / tilt table
# ---------------------------------------------------------------------
[stepper_a]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
# rotation_distance is the amount of axis travel (in degrees) per
# rotation of the motor.  With a 50:1 reducer, one motor turn moves the
# axis 360/50 degrees - express that as rotation_distance plus
# gear_ratio so that microstepping is reported correctly.
rotation_distance: 360
gear_ratio: 50:1
# An endstop_pin makes the axis homeable with "G28 A".  When present,
# position_min/position_max/position_endstop are required, exactly as
# for a linear axis.
endstop_pin: ^PD2
position_endstop: 0
position_min: 0
position_max: 360
homing_speed: 30
#homing_accel: 1000
#   Acceleration (in deg/s^2) used for homing moves of this axis.  The
#   default is axis_max_accel if set, otherwise 1000.
# Optional per-axis limits.  These are unset by default, which means
# rotation has no effect at all on the toolhead's speed planning.  When
# set, a move that would exceed them is slowed down as a whole.
axis_max_velocity: 120
axis_max_accel: 1000
#instantaneous_corner_velocity:
#   If set, limits the junction speed between two moves whose rotation
#   ratio differs (in the same way the extruder option of the same name
#   does).  Unset by default.

# ---------------------------------------------------------------------
# C axis (rotation about Z) - a continuously rotating table with no
# endstop.  Without an endstop the axis is considered homed at 0 on
# startup, and position_min/position_max are optional.
# ---------------------------------------------------------------------
[stepper_c]
step_pin: PH5
dir_pin: PH6
enable_pin: !PB5
microsteps: 16
rotation_distance: 360
#position_min: -720
#position_max: 720
#axis_max_velocity: 360
#axis_max_accel: 3600
