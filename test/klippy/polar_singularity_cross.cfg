# Test config for crossing the bed centre on a core r-theta machine
# whose arm can travel through it.
#
# The same machine as polar_singularity.cfg, but with arm_crosses_centre:
# the arm carriage runs straight through the centre of the bed and on to
# position_max on the far side, so a move that carries on through the
# middle takes the second solution of every x/y position - the arm at a
# negative radius, the bed turned the other half turn - with the bed held
# still.  Both policies cross, printing included.

[stepper_c]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
gear_ratio: 120:16

[stepper_r]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 100
position_min: -100
position_max: 100
homing_speed: 50

[stepper_tilt]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 30

[stepper_z]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 2
endstop_pin: ^PD3
position_endstop: 0.5
position_min: -2
position_max: 200

[extruder]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corertheta
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30
max_angular_velocity: 5
additional_axes: b
arm_crosses_centre: True

# The velocity limit is the one the [printer] section already states.
# The acceleration limit is set here well above 0.65 * 5^2 = 16.2, so it
# never limits a feedrate and only ever bounds acceleration - which is
# what keeps the expected feedrates in the test readable.
[polar_singularity]
travel_policy: cross
print_policy: cross
max_angular_accel: 50
min_velocity: 0.5
