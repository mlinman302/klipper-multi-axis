# Test config for RTCP compensation on a B axis tilting head.
#
# The head tilts about B (parallel to Y).  G-code commands where the tool
# tip should be; the X and Z carriages move to hold the tip there as the
# head tilts.  See docs/Multi_Axis.md.
#
# Note the Z travel: with a 40mm tool offset and B limited to +/-45
# degrees the Z carriage dips up to 40*(cos45-1) = -11.7mm below the
# commanded tip Z, and X swings up to 40*sin45 = -/+28.3mm (a positive B
# tilts the nozzle outboard, so the X carriage retreats).  The rails must be able to
# reach that, which is why position_min is negative here.

[stepper_x]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40
endstop_pin: ^PE5
position_endstop: 0
position_min: -40
position_max: 200
homing_speed: 50

[stepper_y]
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 0
position_max: 200
homing_speed: 50

[stepper_z]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 8
endstop_pin: ^PD3
position_endstop: 0.5
position_min: -20
position_max: 200

# The tilting head axis
[stepper_b]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 360
gear_ratio: 50:1
endstop_pin: ^PD2
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 20

[rtcp]
# How far the tool tip sits below the B pivot, measured at B=0
tool_vertical_offset: 40.0
# ...and how far inboard of it (towards the centre of the bed)
#tool_horizontal_offset: 0.0
#enable: True

[extruder]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
additional_axes: b
