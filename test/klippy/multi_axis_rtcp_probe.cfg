# Test config for probing and mesh bed levelling on an RTCP tilting head.
#
# A core r-theta machine - rotating bed plus a radial arm - carrying a
# probe bolted to the tilting head, 45 degrees around the B pivot from
# the nozzle.  The probe therefore has no fixed x/y offset from the
# nozzle: [rtcp_probe] works its position out from the [rtcp] pivot.
# See docs/Multi_Axis.md.
#
# B homes at -45, where the probe rides 48.9mm *above* the nozzle; the
# nozzle faces the bed at B=0 and the probe at B=45.  With a 69.17mm
# pivot radius and the probe a quarter turn round from the nozzle, the
# probe sits 48.91mm inboard of the nozzle and 20.16mm below it while
# probing.  So the arm covers the 50mm bed radius from an arm
# radius of 48.91 to 98.91 - it never approaches the bed centre - and the
# nozzle reads z=20.16 when the probe triggers on a flat bed, which is
# why horizontal_move_z has to be so much larger than usual.

[stepper_c]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
gear_ratio: 120:16

[stepper_r]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 149.21
position_min: 0
position_max: 149.21
homing_speed: 50

[stepper_tilt]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2
position_endstop: -45
position_min: -45
position_max: 100
homing_speed: 30

# Z homes on the probe.  position_min bounds how far the *probe* may
# descend on a probing move, not the nozzle.
[stepper_z]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_min: -8
position_max: 200

[rtcp]
pivot_length: 69.1717
pivot_x_offset: 0

# No x_offset/y_offset - the probe swings with the head, so [rtcp_probe]
# supplies the offsets instead.  z_offset is the difference between the
# nozzle's and the probe's radius about the pivot.
[probe]
pin: ^PC7
z_offset: -0.1

[rtcp_probe]
probe_b_offset: -45
probe_b_position: 45
invert_b_direction: True
bed_radius: 50
orient_lift_z: 40

[bed_mesh]
speed: 60
horizontal_move_z: 26
mesh_radius: 50
mesh_origin: 0, 0
round_probe_count: 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0

[extruder]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corertheta
max_velocity: 100
max_accel: 3000
max_z_velocity: 2
max_z_accel: 50
max_angular_velocity: 5
additional_axes: b
b_coupling_ratio: 0.25
