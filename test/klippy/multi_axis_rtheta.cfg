# Test config for a core r-theta stage.
#
# Two motors share one belt: together they set both the radial position
# (the X carriage) and the rotation of the end effector (the C carriage).
# Each motor is a linear combination of a linear and a rotational axis,
# which is only expressible because both live in the same motion queue.
#
#   motor_1 = 0.5*x + 0.5*c
#   motor_2 = 0.5*x - 0.5*c
#
# Moving x alone turns both motors the same way; moving c alone turns
# them in opposition - the CoreXY idiom applied to a rotational axis.

[carriage carriage_x]
axis: x
position_endstop: 0
position_max: 200
homing_speed: 50
endstop_pin: ^PE5

[carriage carriage_y]
axis: y
position_endstop: 0
position_max: 200
homing_speed: 50
endstop_pin: ^PJ1

[carriage carriage_z]
axis: z
position_endstop: 0.5
position_max: 100
endstop_pin: ^PD3

# The rotational carriage.  Optional - a machine with no rotational axes
# simply omits it.
[carriage carriage_c]
axis: c
position_endstop: 0
position_min: 0
position_max: 360
homing_speed: 30
endstop_pin: ^PD2

[stepper rtheta_1]
carriages: 0.5*carriage_x + 0.5*carriage_c
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
rotation_distance: 40

[stepper rtheta_2]
carriages: 0.5*carriage_x - 0.5*carriage_c
step_pin: PF6
dir_pin: !PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40

[stepper stepper_y]
carriages: carriage_y
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40

[stepper stepper_z]
carriages: carriage_z
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 8

[extruder]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: generic_cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100
# Declaring 'c' gives the axis its G-code word and its range checking.
# The motion itself is produced by the coupled steppers above.
additional_axes: c
