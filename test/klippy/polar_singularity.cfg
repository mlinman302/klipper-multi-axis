# Test config for the bed centre singularity checks on a core r-theta
# machine.
#
# The bed angle is derived from the commanded X/Y, so it has no value at
# all on the line X=0 Y=0 - a tool tip travelling through [0, 0, N] asks
# the bed for a half turn in the instant the sign flips.  No RTCP and no
# B projection here: the bed angle depends only on the commanded tip
# position, so neither of those changes what is singular, and leaving
# them out keeps the test on the one thing it is about.
#
# max_angular_velocity of 5 rad/s puts the velocity limit at 5 * r_min:
# a chord passing 20mm from the centre is held to 100mm/s and one
# passing 1mm from it to 5mm/s.  min_velocity of 0.5mm/s then refuses
# anything closer than 0.1mm.

[stepper_c]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
gear_ratio: 120:16

[stepper_r]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 100
position_min: 0
position_max: 100
homing_speed: 50

[stepper_tilt]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2
position_endstop: 0
position_min: -45
position_max: 45
homing_speed: 30

[stepper_z]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 2
endstop_pin: ^PD3
position_endstop: 0.5
position_min: -2
position_max: 200

[extruder]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corertheta
max_velocity: 300
max_accel: 3000
max_z_velocity: 25
max_z_accel: 30
max_angular_velocity: 5
additional_axes: b

# The velocity limit is the one the [printer] section already states.
# The acceleration limit is set here well above 0.65 * 5^2 = 16.2, so it
# never limits a feedrate and only ever bounds acceleration - which is
# what keeps the expected feedrates in the test readable.
[polar_singularity]
max_angular_accel: 50
min_velocity: 0.5
