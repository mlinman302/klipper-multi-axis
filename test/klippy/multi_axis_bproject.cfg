# Test config for the bed-frame B projection on an RTCP tilting head.
#
# A core r-theta machine - rotating bed plus a radial arm - carrying a
# probe bolted to the tilting head, 45 degrees around the B pivot from
# the nozzle.  See docs/Multi_Axis.md.
#
# B homes at -45, the nozzle points straight down at B=0 (always, by
# definition) and the probe pin at B=45, which is the probe's b_offset.
#
# Probing runs with RTCP compensation off, so the toolhead reports the
# carriage rather than the tool tip and the probe is an ordinary probe at
# a fixed offset from it: straight below the pivot at the probing angle,
# hence x_offset/y_offset of zero, and triggering 0.1mm above the
# carriage reference point, hence z_offset of -0.1.

[stepper_c]
step_pin: PF0
dir_pin: PF1
enable_pin: !PD7
microsteps: 16
gear_ratio: 120:16

[stepper_r]
step_pin: PF6
dir_pin: PF7
enable_pin: !PF2
microsteps: 16
rotation_distance: 40
endstop_pin: ^PJ1
position_endstop: 149.21
position_min: 0
position_max: 149.21
homing_speed: 50

[stepper_tilt]
step_pin: PL3
dir_pin: PL1
enable_pin: !PK0
microsteps: 16
rotation_distance: 40
endstop_pin: ^PD2
position_endstop: -45
position_min: -45
position_max: 100
homing_speed: 30

# Z homes on the probe.  Probing runs with RTCP off, so position_min
# bounds the carriage descent in the ordinary way.
[stepper_z]
step_pin: PA4
dir_pin: PA6
enable_pin: !PA2
microsteps: 16
rotation_distance: 2
endstop_pin: probe:z_virtual_endstop
position_min: -8
position_max: 200

[rtcp]
tool_vertical_offset: 69.1717
tool_horizontal_offset: 0

# The probe owns all four of its offsets.  b_offset is the B angle at
# which the pin is vertical; x/y/z_offset are measured with the head at
# that angle, with RTCP off.
[probe]
pin: ^PC7
b_offset: 45
x_offset: 0
y_offset: 0
z_offset: -0.1

[rtcp_probe]
bed_radius: 50
orient_lift_z: 40

[bed_mesh]
speed: 60
horizontal_move_z: 5
mesh_radius: 50
mesh_origin: 0, 0
round_probe_count: 5
algorithm: bicubic
fade_start: 1.0
fade_end: 10.0

[extruder]
step_pin: PA0
dir_pin: PA1
enable_pin: !PA3
microsteps: 16
rotation_distance: 33.5
nozzle_diameter: 0.500
filament_diameter: 3.500
heater_pin: PB4
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PK5
control: pid
pid_Kp: 22.2
pid_Ki: 1.08
pid_Kd: 114
min_temp: 0
max_temp: 210

[mcu]
serial: /dev/ttyACM0

[printer]
kinematics: corertheta
max_velocity: 100
max_accel: 3000
max_z_velocity: 2
max_z_accel: 50
max_angular_velocity: 5
additional_axes: b
b_coupling_ratio: 0.25

# Read a commanded B as a lean toward the *bed's* +x direction and give
# the machine the projection of it onto the plane the head can tilt in.
# The probing angle and the park angle sit outside the band, so they
# still reach the machine untouched.
[b_projection]
max_angle: 40
taper_range: 5
max_b_velocity: 60
